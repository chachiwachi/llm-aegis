name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Lint
        run: make lint

      - name: Tests del motor (Rust)
        run: make test-engine

      - name: Tests del gateway (Go + WASM)
        run: make test-go

      - name: Binario
        run: make build

      - uses: actions/upload-artifact@v7
        with:
          name: aegis-linux-amd64
          path: bin/aegis

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Imagen Docker
        run: docker build -t llm-aegis:ci .
