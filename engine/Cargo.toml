[package]
name = "aegis-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Motor de detección de llm-aegis: prompt injection, ofuscación, PII y secretos. Se compila a WebAssembly y lo carga el gateway en Go."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
serde = { version = "1", features = ["derive"] }

# Solo la interfaz WebAssembly (src/abi.rs) serializa JSON.
[target.'cfg(target_arch = "wasm32")'.dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
